name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege by default; only the release job may write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.DOZYPAL_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dozypal.p12"
            echo "DOZYPAL_KEYSTORE_PATH=$RUNNER_TEMP/dozypal.p12" >> "$GITHUB_ENV"
          else
            echo "No signing key available (for example a pull request from a fork). Building an unsigned APK."
          fi

      - name: Prepare Firebase config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
          else
            echo "No Firebase config available. Building without Scroll Battles."
          fi

      - name: Build release APK
        env:
          DOZYPAL_KEYSTORE_PASSWORD: ${{ secrets.DOZYPAL_KEYSTORE_PASSWORD }}
          DOZYPAL_KEY_ALIAS: ${{ secrets.DOZYPAL_KEY_ALIAS }}
          DOZYPAL_KEY_PASSWORD: ${{ secrets.DOZYPAL_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.{0}', github.run_number) }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Collect APK
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/dozypal.p12" app/google-services.json
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DozyPal-apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DozyPal-apk
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          test -f dist/app-release.apk || { echo "APK is not signed; refusing to publish."; exit 1; }
          mv dist/app-release.apk "dist/DozyPal-$TAG.apk"
          gh release create "$TAG" "dist/DozyPal-$TAG.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "DozyPal $TAG" \
            --generate-notes
